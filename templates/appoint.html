<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Booking Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("{{ url_for('static', filename='3.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .form-container {
            background-color: rgba(255, 255, 255, 0.8); /* Slightly higher opacity */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px; /* Ensures responsiveness */
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px; /* Adjusted for better visibility */
        }
        label {
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
            color: #333;
        }
        input, textarea, select {
            width: 100%;
            padding: 5px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 14px;
            color: #333;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
            padding: 8px;
            font-size: 14px;
        }
        input[type="submit"]:hover {
            background-color: #0056b3; /* Slightly darker blue on hover */
        }
        #popup-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div id="popup-message">
            {% for message in messages %}
            <h2>{{ message }}</h2>
            {% endfor %}
            <button onclick="closePopup()">Close</button>
        </div>
        <script>
            document.getElementById("popup-message").style.display = "block";
        </script>
        {% endif %}
        {% endwith %}
        <h2>Medical Appointment</h2>
        <form action="{{ url_for('appoint') }}" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="appointment-date">Preferred Appointment Date</label>
            <input type="date" id="appointment-date" name="appointment-date" required>

            <label for="appointment-time">Preferred Appointment Time</label>
            <input type="time" id="appointment-time" name="appointment-time" required>

            <label for="message">Message (Optional)</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <input type="submit" value="Book Appointment">
        </form>
    </div>
    <script>
        function closePopup() {
            document.getElementById("popup-message").style.display = "none";
        }
    </script>
</body>
</html>
